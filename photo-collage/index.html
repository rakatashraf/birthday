<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5ed">
  <title>For the birthday girl</title>
  <style>
    :root {
      --paper: #fff5ed;
      --ink: #342326;
      --muted: #80696a;
      --line: rgba(92, 47, 55, .16);
      --rose: #e88992;
      --rose-deep: #b54f67;
      --cream: #fffdf9;
      --shadow: 0 30px 70px rgba(67, 44, 33, .16);
      --radius: 26px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 13%, rgba(232, 137, 146, .2), transparent 25rem),
        radial-gradient(circle at 91% 79%, rgba(247, 202, 112, .24), transparent 26rem),
        linear-gradient(135deg, rgba(255, 255, 255, .7), transparent 48%),
        var(--paper);
      font-family: Georgia, 'Times New Roman', serif;
    }

    button { font: inherit; }

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 34px;
    }

    .topbar, .toolbar, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow, .microcopy, .counter, .thumb-number, .footer, .control-label {
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow {
      color: var(--rose-deep);
      font-size: 11px;
      font-weight: 700;
    }

    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--rose-deep);
      font-size: 18px;
      background: rgba(255, 250, 246, .52);
    }

    .intro {
      max-width: 710px;
      margin: 54px 0 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 90px);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .94;
    }

    h1 em { color: var(--rose-deep); font-style: italic; }

    .intro p {
      max-width: 520px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .gallery {
      position: relative;
      min-height: 710px;
      padding: 30px 0 0;
    }

    .gallery::after {
      content: '✦  ✧  ✦  ✧  ✦';
      position: absolute;
      top: 6px;
      right: 9%;
      color: var(--rose-deep);
      font-size: 20px;
      letter-spacing: .35em;
      opacity: .7;
      transform: rotate(7deg);
      pointer-events: none;
    }

    .gallery::before {
      content: '';
      position: absolute;
      inset: 0 0 120px;
      border: 1px solid var(--line);
      border-radius: 38px;
      pointer-events: none;
    }

    .stage {
      position: relative;
      min-height: 600px;
      overflow: hidden;
      border-radius: 38px;
      background: linear-gradient(145deg, rgba(255, 246, 239, .72), rgba(255, 224, 219, .36));
    }

    .stage::before,
    .stage::after {
      position: absolute;
      z-index: 1;
      color: rgba(181, 79, 103, .58);
      font-size: 22px;
      pointer-events: none;
    }

    .stage::before { content: '✦  •  ✧  •  ✦'; top: 42px; left: 7%; transform: rotate(-12deg); }
    .stage::after { content: '•  ✧  •  ✦'; right: 7%; bottom: 124px; transform: rotate(12deg); }

    .ambient {
      position: absolute;
      inset: 25px 20%;
      overflow: hidden;
      border-radius: 44px;
      opacity: .28;
      filter: blur(35px) saturate(.82);
      transform: scale(1.08);
    }

    .ambient img { width: 100%; height: 100%; object-fit: cover; }

    .hero-card {
      position: absolute;
      z-index: 3;
      top: 24px;
      left: 50%;
      width: min(420px, 46vw);
      height: 560px;
      margin: 0;
      overflow: hidden;
      border: 10px solid var(--cream);
      border-radius: 10px 10px 22px 22px;
      background: #ded4cc;
      box-shadow: 0 30px 70px rgba(181, 79, 103, .24), 0 0 0 8px rgba(255, 255, 255, .25);
      transform: translateX(-50%) rotate(-2deg);
      cursor: zoom-in;
    }

    .hero-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 63%, rgba(23, 16, 14, .58));
      pointer-events: none;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      z-index: 1;
      inset: 0;
      background:
        radial-gradient(ellipse at 35% 43%, rgba(255, 122, 151, .42) 0 6%, transparent 15%),
        radial-gradient(ellipse at 67% 43%, rgba(255, 122, 151, .42) 0 6%, transparent 15%);
      mix-blend-mode: screen;
      opacity: .78;
      pointer-events: none;
      animation: happy-blush 3.4s ease-in-out infinite;
    }

    @keyframes happy-blush {
      0%, 100% { opacity: .5; }
      50% { opacity: .92; }
    }

    .hero-card img, .polaroid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-card img { transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .35s ease; }
    .hero-card:hover img { transform: scale(1.035); }

    .hero-meta {
      position: absolute;
      z-index: 3;
      right: 26px;
      bottom: 22px;
      left: 26px;
      color: #fffaf6;
    }

    .hero-meta span {
      display: block;
      margin-bottom: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
      opacity: .8;
    }

    .hero-meta strong { font-size: 27px; font-weight: 400; }

    .birthday-stamp {
      position: absolute;
      z-index: 4;
      top: 38px;
      left: calc(50% + min(245px, 25vw));
      width: 132px;
      padding: 13px 10px;
      border: 1px solid rgba(181, 79, 103, .35);
      border-radius: 50%;
      color: var(--rose-deep);
      background: rgba(255, 253, 249, .88);
      box-shadow: 0 12px 24px rgba(181, 79, 103, .12);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      line-height: 1.35;
      text-align: center;
      text-transform: uppercase;
      transform: rotate(10deg);
    }

    .polaroid {
      position: absolute;
      z-index: 2;
      width: min(270px, 29vw);
      height: 360px;
      padding: 10px 10px 44px;
      background: var(--cream);
      box-shadow: 0 20px 45px rgba(67, 44, 33, .14);
      transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
    }

    .polaroid img { filter: saturate(.88); }
    .polaroid.left { top: 106px; left: 8%; transform: rotate(-12deg); }
    .polaroid.right { top: 158px; right: 8%; transform: rotate(11deg); }

    .nav {
      position: absolute;
      z-index: 5;
      right: 50%;
      bottom: 24px;
      display: flex;
      gap: 9px;
      transform: translateX(50%);
    }

    .icon-button, .play-button {
      border: 1px solid rgba(255, 250, 246, .52);
      color: var(--ink);
      background: rgba(255, 250, 246, .76);
      box-shadow: 0 8px 20px rgba(67, 44, 33, .1);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 23px;
      line-height: 1;
    }

    .icon-button:hover, .play-button:hover { color: #fffaf6; background: var(--rose-deep); transform: translateY(-2px); }
    .icon-button:focus-visible, .play-button:focus-visible, .thumb:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }

    .toolbar {
      position: relative;
      z-index: 6;
      margin: -94px 30px 0;
      align-items: end;
    }

    .caption { max-width: 310px; }
    .caption h2 { margin: 8px 0 8px; font-size: 31px; font-weight: 400; }
    .caption p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }

    .counter { color: var(--rose-deep); font-size: 12px; font-weight: 700; }
    .counter .current { font-size: 22px; letter-spacing: 0; }

    .play-button {
      min-width: 116px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .thumb-rail {
      position: relative;
      z-index: 6;
      display: flex;
      gap: 10px;
      max-width: 100%;
      margin: 28px 30px 0;
      padding: 9px 3px 12px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--rose) transparent;
    }

    .thumb {
      position: relative;
      flex: 0 0 72px;
      width: 72px;
      height: 86px;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #dfd5cd;
      cursor: pointer;
      opacity: .62;
      transform: rotate(var(--tilt));
      transition: opacity .25s ease, transform .25s ease, border-color .25s ease;
    }

    .thumb:hover, .thumb[aria-current="true"] { opacity: 1; transform: translateY(-5px) rotate(0); }
    .thumb[aria-current="true"] { border-color: var(--rose-deep); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    .thumb-number {
      position: absolute;
      right: 6px;
      bottom: 6px;
      color: #fff;
      font-size: 9px;
      text-shadow: 0 1px 4px rgba(0,0,0,.65);
    }

    .footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .09em;
    }

    .lightbox[hidden] { display: none; }

    .lightbox {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(28, 21, 18, .9);
      backdrop-filter: blur(14px);
    }

    .lightbox figure { position: relative; max-width: min(90vw, 720px); max-height: 90vh; margin: 0; }
    .lightbox img { display: block; max-width: 90vw; max-height: 86vh; border: 8px solid var(--cream); border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
    .lightbox figcaption { margin-top: 12px; color: #fffaf6; text-align: center; font-size: 16px; }
    .close-lightbox { position: absolute; top: -16px; right: -16px; width: 42px; height: 42px; border: 0; border-radius: 50%; color: var(--ink); background: var(--cream); cursor: pointer; font-size: 22px; }

    body { min-height: 100vh; overflow: hidden; }
    .gallery { width: 100%; min-height: 100vh; padding: 0; }
    .stage { min-height: 100vh; height: 100vh; border-radius: 0; background: #24171b; }
    .stage::before, .stage::after, .gallery::before, .gallery::after { display: none; }
    .hero-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      transform: none;
      cursor: default;
    }
    .hero-card img { transition: opacity .18s ease; }
    .hero-card::after { background: linear-gradient(180deg, rgba(20, 9, 14, .04) 45%, rgba(20, 9, 14, .76) 100%); }
    .hero-card::before { opacity: .42; }
    .hero-meta {
      right: 8vw;
      bottom: 9vh;
      left: 8vw;
      z-index: 3;
      text-align: center;
    }
    .hero-meta strong {
      display: block;
      margin: 0 auto;
      max-width: 760px;
      color: #fffaf6;
      font-size: 34px;
      font-style: italic;
      font-weight: 400;
      line-height: 1.2;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .32);
      transition: opacity .18s ease;
    }

    .celebration {
      position: absolute;
      z-index: 8;
      inset: 0;
      overflow: hidden;
      visibility: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 211, 119, .28), transparent 28%),
        linear-gradient(145deg, #321727, #120e1c 72%);
      opacity: 0;
      transition: opacity .35s ease;
    }

    .stage.celebration-mode .hero-card { display: none; }
    .stage.celebration-mode .celebration { visibility: visible; opacity: 1; }

    .collage-wall {
      position: absolute;
      inset: 9vh 8vw 5vh;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      opacity: .78;
      transform: rotate(-2deg) scale(1.04);
    }

    .collage-wall img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 5px solid #fffdf9;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
      filter: saturate(1.12) brightness(.78);
    }

    .collage-wall img:nth-child(2n) { transform: translateY(12px) rotate(3deg); }
    .collage-wall img:nth-child(3n) { transform: translateY(-8px) rotate(-4deg); }

    .birthday-title {
      position: absolute;
      z-index: 5;
      top: 7vh;
      left: 50%;
      display: flex;
      color: #fffdf9;
      font-size: clamp(44px, 8vw, 104px);
      font-style: italic;
      font-weight: 400;
      letter-spacing: .01em;
      text-shadow: 0 0 8px #fff, 0 0 22px #ffd36b, 0 5px 28px rgba(0, 0, 0, .5);
      transform: translateX(-50%) rotate(-4deg);
      white-space: nowrap;
    }

    .birthday-title span { display: block; }
    .birthday-title span:nth-child(1) { transform: translateY(18px) rotate(-12deg); }
    .birthday-title span:nth-child(2) { transform: translateY(8px) rotate(-7deg); }
    .birthday-title span:nth-child(3) { transform: translateY(1px) rotate(-3deg); }
    .birthday-title span:nth-child(4) { transform: translateY(-4px) rotate(0); }
    .birthday-title span:nth-child(5) { transform: translateY(-5px) rotate(3deg); }
    .birthday-title span:nth-child(6) { transform: translateY(-1px) rotate(6deg); }
    .birthday-title span:nth-child(7) { transform: translateY(8px) rotate(10deg); }
    .birthday-title span:nth-child(8) { transform: translateY(18px) rotate(14deg); }

    .birthday-person {
      position: absolute;
      z-index: 4;
      bottom: 0;
      left: 50%;
      width: min(650px, 76vw);
      height: 100%;
      overflow: visible;
      clip-path: none;
      opacity: 0;
      transform: translate(-50%, 110%);
      filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px rgba(255, 226, 154, .9));
      transition: opacity .25s ease, transform .85s cubic-bezier(.2,.85,.25,1);
    }

    .birthday-person img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
    .stage.celebration-mode.person-visible .celebration .birthday-person { opacity: 1 !important; transform: translate(-50%, 0) !important; }

    .sparkles,
    .sparkles::before,
    .sparkles::after {
      position: absolute;
      z-index: 6;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fffdf9;
      box-shadow: 0 0 8px #fff, 0 0 18px #ffd36b;
      animation: sparkle-pop 1.1s ease-in-out infinite alternate;
      content: '';
    }

    .sparkles { top: 28%; left: 14%; }
    .sparkles::before { top: 190px; left: 70vw; animation-delay: .3s; }
    .sparkles::after { top: 28vh; left: 40vw; animation-delay: .6s; }

    .cracker {
      position: absolute;
      z-index: 6;
      width: 2px;
      height: 130px;
      background: linear-gradient(#fff, #ffd36b, transparent);
      transform-origin: bottom;
      animation: cracker-burst 1.2s ease-in-out infinite;
    }

    .cracker::before,
    .cracker::after {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px #ffd36b;
      content: '';
    }

    .cracker::before { top: 0; left: -3px; }
    .cracker::after { top: 45px; left: 22px; }
    .cracker.one { top: 35%; left: 18%; transform: rotate(-42deg); }
    .cracker.two { top: 32%; right: 18%; transform: rotate(42deg); animation-delay: .4s; }

    @keyframes sparkle-pop { from { opacity: .25; transform: scale(.6); } to { opacity: 1; transform: scale(1.5); } }
    @keyframes cracker-burst { 0%, 100% { opacity: .3; transform: scaleY(.7) rotate(-42deg); } 50% { opacity: 1; transform: scaleY(1.15) rotate(-42deg); } }

    @media (max-width: 760px) {
      .page { width: 100%; padding: 0; }
      .intro { margin-top: 42px; }
      .intro p { font-size: 15px; }
      .gallery { min-height: 620px; padding-top: 18px; }
      .gallery::before { inset: 0 0 112px; border-radius: 26px; }
      .stage { min-height: 508px; border-radius: 26px; }
      .hero-card { top: 26px; width: min(280px, 62vw); height: 390px; border-width: 7px; transform: translateX(-50%) rotate(-1.5deg); }
      .hero-meta { right: 16px; bottom: 16px; left: 16px; }
      .hero-meta strong { font-size: 21px; }
      .polaroid { width: 140px; height: 210px; padding: 6px 6px 29px; }
      .polaroid.left { top: 128px; left: -12px; }
      .polaroid.right { top: 168px; right: -12px; }
      .nav { bottom: 20px; }
      .icon-button { width: 44px; height: 44px; }
      .toolbar { margin: -79px 18px 0; display: grid; grid-template-columns: 1fr auto; align-items: end; }
      .caption { grid-column: 1 / -1; margin-bottom: 14px; }
      .caption h2 { font-size: 26px; }
      .thumb-rail { margin-right: 18px; margin-left: 18px; }
      .footer { display: block; line-height: 1.7; }
      .footer span { display: block; }
      .hero-meta { right: 22px; bottom: 8vh; left: 22px; }
      .hero-meta strong { font-size: 24px; }
      .stage { min-height: 100vh; height: 100vh; border-radius: 0; }
      .gallery { min-height: 100vh; padding: 0; }
      .hero-card { inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; transform: none; }
      .collage-wall { inset: 17vh 3vw 5vh; gap: 5px; }
      .collage-wall img { border-width: 2px; }
      .birthday-title { top: 8vh; font-size: clamp(36px, 11vw, 64px); }
      .birthday-person { width: min(520px, 96vw); height: 100%; }
    }

    /* Keep the full-screen composition inside mobile browser chrome. */
    .gallery, .stage { min-height: 100svh; }
    .stage { height: 100svh; }
    .sound-button {
      position: fixed;
      z-index: 12;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      background: rgba(36, 23, 27, .85);
      color: #fffdf9;
      font: 14px Arial, sans-serif;
      cursor: pointer;
    }
    .sound-button:focus-visible { outline: 3px solid #fffdf9; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <button id="sound-button" class="sound-button" type="button" aria-pressed="false">Enable sound</button>
  <main class="gallery" aria-label="A full-screen photo love letter">
    <section class="stage" id="stage" aria-live="polite">
      <figure class="hero-card" id="hero-card">
        <img id="hero-image" src="assets/02.jpg" alt="Birthday girl holding a bouquet and smiling">
        <figcaption class="hero-meta"><strong id="hero-title">I will choose you, in every lifetime.</strong></figcaption>
      </figure>
      <section class="celebration" id="celebration" aria-label="Birthday celebration">
        <div class="collage-wall" aria-hidden="true">
          <img src="assets/01.jpg" alt="">
          <img src="assets/02.jpg" alt="">
          <img src="assets/03.jpg" alt="">
          <img src="assets/04.jpg" alt="">
          <img src="assets/05.jpg" alt="">
          <img src="assets/06.jpg" alt="">
          <img src="assets/07.jpg" alt="">
          <img src="assets/08.jpg" alt="">
          <img src="assets/09.jpg" alt="">
          <img src="assets/10.jpg" alt="">
        </div>
        <h1 class="birthday-title" aria-label="Happy Birthday"><span>H</span><span>a</span><span>p</span><span>p</span><span>y</span><span> </span><span>B</span><span>irthday</span></h1>
        <div class="birthday-person"><img src="assets/birthday-person.png" alt="Birthday girl holding flowers"></div>
        <div class="sparkles" aria-hidden="true"></div>
        <div class="cracker one" aria-hidden="true"></div>
        <div class="cracker two" aria-hidden="true"></div>
      </section>
    </section>
  </main>

  <script>
    const heroImage = document.getElementById('hero-image');
    const heroTitle = document.getElementById('hero-title');
    const stage = document.getElementById('stage');
    const birthdayPerson = document.querySelector('.birthday-person');
    let current = 0;
    let celebrationTimer;
    let slideshowTimer;
    let spokenSlide = -1;
    let spokenCelebration = new Set();

    const soundButton = document.getElementById('sound-button');
    let soundEnabled = false;
    let activeSpeech = null;
    let musicContext;
    let musicGain;
    let musicTimer;
    const chordNotes = [
      [261.63, 329.63, 392.00],
      [293.66, 349.23, 440.00],
      [261.63, 329.63, 392.00],
      [246.94, 311.13, 369.99]
    ];

    function startMusic() {
      if (!window.AudioContext && !window.webkitAudioContext) return;
      if (!musicContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        musicContext = new AudioContext();
        musicGain = musicContext.createGain();
        musicGain.gain.value = .045;
        musicGain.connect(musicContext.destination);
        let chordIndex = 0;
        const playChord = () => {
          const now = musicContext.currentTime;
          chordNotes[chordIndex].forEach((frequency, noteIndex) => {
            const oscillator = musicContext.createOscillator();
            const noteGain = musicContext.createGain();
            oscillator.type = noteIndex === 1 ? 'sine' : 'triangle';
            oscillator.frequency.value = frequency / 2;
            noteGain.gain.setValueAtTime(0, now);
            noteGain.gain.linearRampToValueAtTime(.22, now + 1.3);
            noteGain.gain.linearRampToValueAtTime(0, now + 6.2);
            oscillator.connect(noteGain);
            noteGain.connect(musicGain);
            oscillator.start(now);
            oscillator.stop(now + 6.3);
          });
          chordIndex = (chordIndex + 1) % chordNotes.length;
        };
        playChord();
        musicTimer = window.setInterval(playChord, 6000);
      }
      if (musicContext.state === 'suspended') musicContext.resume().catch(() => {});
    }
    soundButton.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundButton.textContent = soundEnabled ? 'Mute sound' : 'Enable sound';
      soundButton.setAttribute('aria-pressed', String(soundEnabled));
      if (soundEnabled) {
        // Audio is only requested from this user gesture, never during page load.
        try { startMusic(); } catch { /* Visual playback must remain available. */ }
      } else {
        if (musicContext) musicContext.suspend().catch(() => {});
        if (activeSpeech) activeSpeech();
      }
    });

    function speakText(text, onComplete) {
      const readingTime = Math.max(4200, text.split(/\s+/).length * 400);
      if (!soundEnabled || !('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        window.setTimeout(onComplete, readingTime);
        return;
      }
      if (activeSpeech) activeSpeech();
      const synth = window.speechSynthesis;
      let completed = false;
      let announcement;
      // Some browsers reject speech without firing onend. Always advance once.
      const startedAt = Date.now();
      const finish = () => {
        if (completed) return;
        completed = true;
        window.clearTimeout(watchdog);
        if (announcement) {
          announcement.onend = null;
          announcement.onerror = null;
        }
        activeSpeech = null;
        try { synth.cancel(); } catch { /* Unsupported speech must not stop the show. */ }
        window.setTimeout(onComplete, Math.max(650, readingTime - (Date.now() - startedAt)));
      };
      const watchdog = window.setTimeout(finish, Math.max(12000, readingTime * 2));
      activeSpeech = finish;
      try {
        synth.cancel();
        announcement = new SpeechSynthesisUtterance(text);
        announcement.lang = 'en-US';
        announcement.rate = .78;
        announcement.pitch = 1.06;
        announcement.volume = 1;
        const preferredVoice = synth.getVoices().find((voice) =>
          /david|google.*male|daniel|alex|mark|guy|fred|tom|george/i.test(voice.name) && voice.lang.startsWith('en')
        );
        if (preferredVoice) announcement.voice = preferredVoice;
        announcement.onend = finish;
        announcement.onerror = finish;
        synth.speak(announcement);
      } catch {
        finish();
      }
    }

    function speakSlide(index, onComplete) {
      if (spokenSlide === index) {
        onComplete();
        return;
      }
      spokenSlide = index;
      speakText(photos[index].quote, onComplete);
    }

    const photos = [
      { src: 'assets/02.jpg', alt: 'Birthday girl outdoors holding a bouquet of flowers', quote: 'I will choose you, in every lifetime.' },
      { src: 'assets/01.jpg', alt: 'Birthday girl smiling shyly in a lavender scarf', quote: 'Your happiness will always be my favorite place to be.' },
      { src: 'assets/03.jpg', alt: 'Birthday girl smiling outdoors in a pink floral outfit', quote: 'I promise to love every version of you, through every season.' },
      { src: 'assets/04.jpg', alt: 'Birthday girl smiling in a bright blue scarf', quote: 'With you, I will keep finding new reasons to call life beautiful.' },
      { src: 'assets/05.jpg', alt: 'Birthday girl smiling at a warm restaurant table', quote: 'I will keep making room for your dreams, your laughter, and your cake.' },
      { src: 'assets/06.jpg', alt: 'Birthday girl smiling in a garden', quote: 'Wherever life takes us, my hand will always be reaching for yours.' },
      { src: 'assets/07.jpg', alt: 'Birthday girl holding flowers beside a window', quote: 'I promise to grow with you, and never stop falling for you.' },
      { src: 'assets/08.jpg', alt: 'Birthday girl smiling beside flowering bushes at night', quote: 'On ordinary nights and unforgettable days, I will be yours.' },
      { src: 'assets/09.jpg', alt: 'Birthday girl smiling surrounded by greenery', quote: 'I will celebrate you loudly, love you gently, and stay for all of it.' },
      { src: 'assets/10.jpg', alt: 'Birthday girl smiling beside an old brick structure', quote: 'Today, tomorrow, and every birthday after this one: always us.' }
    ];

    function showNext() {
      if (current === photos.length - 1) {
        enterCelebration();
        return;
      }
      current = (current + 1) % photos.length;
      const photo = photos[current];
      heroImage.style.opacity = '0';
      heroTitle.style.opacity = '0';
      window.setTimeout(() => {
        heroImage.src = photo.src;
        heroImage.alt = photo.alt;
        heroTitle.textContent = photo.quote;
        heroImage.style.opacity = '1';
        heroTitle.style.opacity = '1';
        speakSlide(current, () => {
          if (current === photos.length - 1) {
            enterCelebration();
          } else {
            slideshowTimer = window.setTimeout(showNext, 650);
          }
        });
      }, 180);
    }

    function enterCelebration() {
      window.clearTimeout(slideshowTimer);
      window.clearTimeout(celebrationTimer);
      spokenCelebration.clear();
      if (!spokenCelebration.has('title')) {
        spokenCelebration.add('title');
        speakText('Happy Birthday', () => {});
      }
      stage.classList.add('celebration-mode');
      celebrationTimer = window.setTimeout(() => {
        stage.classList.add('person-visible');
        birthdayPerson.style.opacity = '1';
        birthdayPerson.style.transform = 'translate(-50%, 0)';
        if (!spokenCelebration.has('person')) {
          spokenCelebration.add('person');
          speakText('Happy Birthday, my love', () => {});
        }
      }, 3000);
      window.setTimeout(() => {
        stage.classList.remove('person-visible', 'celebration-mode');
        birthdayPerson.style.opacity = '';
        birthdayPerson.style.transform = '';
        current = 0;
        heroImage.src = photos[0].src;
        heroImage.alt = photos[0].alt;
        heroTitle.textContent = photos[0].quote;
        spokenSlide = -1;
        speakSlide(0, () => {
          slideshowTimer = window.setTimeout(showNext, 650);
        });
      }, 9000);
    }

    speakSlide(0, () => {
      slideshowTimer = window.setTimeout(showNext, 650);
    });
  </script>
</body>
